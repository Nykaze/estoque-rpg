<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Estoque RPG — acesso à plataforma de gestão de fichas e estoque para mesas de RPG.">
  <meta name="theme-color" content="#101828">
  <title>Entrar · Estoque RPG</title>
  <script>
    (function () {
      try {
        var d = document.documentElement;
        var mode = localStorage.getItem('estoque_mode') || 'light';
        var theme = localStorage.getItem('estoque_theme') || 'default';
        if (mode) d.setAttribute('data-mode', mode);
        if (theme) d.setAttribute('data-theme', theme);
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css?v=16">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23101828'/%3E%3Cpath d='M16 6l2.4 5.9L24 13l-4.3 3.9L21 23l-5-3.1L11 23l1.3-6.1L8 13l5.6-1.1z' fill='%23fff'/%3E%3C/svg%3E">
</head>
<body>
  <div class="login-bg">
    <div class="login-card">
      <div class="login-brand">
        <div class="brand-mark" style="display:flex;align-items:center;justify-content:center;background:var(--sidebar-bg);color:#fff;font-weight:700;">◆</div>
        <div>
          <h1>Estoque RPG</h1>
          <p>Acesse sua conta para continuar</p>
        </div>
      </div>

      <div id="login-error" class="login-error" hidden></div>

      <form id="login-form" novalidate>
        <div class="field">
          <label for="username">Usuário</label>
          <input class="input" id="username" name="username" type="text" autocomplete="username" placeholder="seu usuário" required autocapitalize="none" spellcheck="false">
        </div>
        <div class="field">
          <label for="password">Senha</label>
          <input class="input" id="password" name="password" type="password" autocomplete="current-password" placeholder="sua senha" required>
        </div>
        <button class="btn btn-primary btn-block" type="submit" id="login-btn">
          <span id="login-btn-label">Entrar</span>
        </button>
      </form>
    </div>
  </div>

  <script src="/login.js?v=1"></script>
</body>
</html>
